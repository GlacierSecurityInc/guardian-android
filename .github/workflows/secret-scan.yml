name: Secret Scan

# Gitleaks and TruffleHog over the full git history of the commit being built, on every
# push and pull request, on all branches -- and weekly, so new detectors in a pinned-version
# bump, or a credential that only becomes verifiable later, still get caught on branches
# nobody is pushing to.
#
# The two tools overlap on purpose:
#   gitleaks    Pattern and entropy rules. Fast, catches anything shaped like a secret,
#               live or not. Known non-secrets are listed in .gitleaksignore.
#   trufflehog  Fails only on credentials it can confirm are live (verified) or could not
#               check either way (unknown). Catches real keys gitleaks has no rule for.
#
# Neither needs a repository secret, so unlike code-quality-scan.yml this also runs, and
# means something, on pull requests from forks and from Dependabot.
#
# The same checks run locally before commit: see .pre-commit-config.yaml.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: a secret committed and then deleted is still in the repository.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      # Built from source with `go install` rather than gitleaks-action, which needs a paid
      # licence key on an organisation account. The version is pinned here and the module
      # is checked against the Go checksum database, so this is reproducible.
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git \
            --redact --verbose --no-banner \
            --report-format sarif --report-path gitleaks.sarif \
            .

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  trufflehog:
    name: Secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned by digest (the 3.99.3 multi-arch image). --no-update stops it replacing
      # itself with whatever is newest at run time.
      - name: Scan git history
        run: |
          docker run --rm -v "$PWD:/tmp/repo" -w /tmp/repo \
            trufflesecurity/trufflehog@sha256:63b6120f410beb64aea4e421f1ed277248e14b2942d124df289422b623f610d8 \
            git file:///tmp/repo \
            --results=verified,unknown --fail --no-update --github-actions
