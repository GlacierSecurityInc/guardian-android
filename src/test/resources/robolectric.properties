# Defaults for every @RunWith(RobolectricTestRunner.class) test. A single test class can
# override any of these with @Config(...).

# Boot the stock android.app.Application, NOT the app's own GlacierGuardian.
#
# GlacierGuardian.onCreate() configures Amplify/Cognito, Firebase, the DatabaseBackend and the
# WireGuard state monitor. Under Robolectric that chain reaches org.conscrypt, whose Android
# artifact carries a native library (conscrypt_jni) that does not exist on the JVM, so booting
# the real Application dies with UnsatisfiedLinkError before the first assertion runs.
#
# Booting it is also the wrong thing to want here: these are unit tests, and the app's real
# startup does network and keystore work. A test that genuinely needs app-level state should
# set it up explicitly rather than rely on onCreate() having run.
application=android.app.Application

# Pin the SDK level instead of inheriting targetSdkVersion from the manifest. Robolectric can
# only run against the android-all jar staged by the stageRobolectricSdk task in build.gradle,
# and that task stages exactly one. Keeping the level here means a targetSdkVersion bump does
# not silently ask Robolectric for a jar that was never staged -- when this moves, the
# coordinate in build.gradle has to move with it.
sdk=37
