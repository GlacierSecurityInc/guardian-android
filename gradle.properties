android.useAndroidX=true
# Required for me.leolin:ShortcutBadger, which still compiles against the
# pre-AndroidX support library and has no AndroidX release.
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.jvmargs=-Xmx4096m

# ---- Instrumented test fleet (see android.testOptions.managedDevices in build.gradle) ----
# How many managed-device emulators the build boots at once. Kept low so a developer machine
# that is already running other emulators is not overloaded. Raise it for a dedicated CI runner.
android.experimental.testOptions.managedDevices.maxConcurrentDevices=2
# Creating a managed AVD, booting it cold and installing a ~300 MB debug APK does not fit
# in the default setup window when two are doing it at once.
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
